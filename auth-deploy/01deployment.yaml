apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels:
    app: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
      - name: auth
        image: docker.io/siddhartha0709/auth-service:7fb621a31205d79d8801f1212bff2ddd4c910221
        ports:
        - containerPort: 3001
        env:
         - name: MONGO_URI
           value: mongodb://mongo:27017/auth-db
         - name: ALLOWED_ORIGIN
           value: "*"
