apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  labels:
    app: cart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cart
  template:
    metadata:
      labels:
        app: cart
    spec:
      containers:
      - name: cart
        image: docker.io/siddhartha0709/cart-service:2a59ccb7c821a06df45bb221ed76d7f2c2e61689
        ports:
        - containerPort: 3003
        env:
         - name: MONGO_URI
           value: mongodb://mongo:27017/cart-db
         - name: ALLOWED_ORIGIN
           value: "*"
